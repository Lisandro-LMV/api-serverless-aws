name: Deploy Lambda

# Cuando se dispara el robot: en cada push a la rama main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baja tu código del repo a la máquina del robot
      - name: Bajar el código
        uses: actions/checkout@v4

      # 2. Configura las credenciales de AWS usando los Secrets
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 3. Empaqueta el código en un .zip y lo sube a la Lambda
      - name: Desplegar a Lambda
        run: |
          zip funcion.zip lambda_function.py
          aws lambda update-function-code \
            --function-name holaMundo \
            --zip-file fileb://funcion.zip \
            --region ap-southeast-2
